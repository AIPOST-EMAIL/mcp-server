# Smithery configuration for AIPost MCP Server
# https://smithery.ai/docs/config
#
# This server requires an AIPost.email API key to make requests.
# Users can get a free key at: https://aipost.email/register
#
# When configSchema is working correctly, Smithery will prompt each user
# for their aipostApiKey before starting the server. The key is injected as
# the AIPOST_API_KEY environment variable.
#
# TROUBLESHOOTING: If Smithery isn't showing the configSchema prompt,
# the deployment may need to be recreated so Smithery re-reads this file.
# See: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - aipostApiKey
    properties:
      aipostApiKey:
        type: string
        description: >-
          Your AIPost.email API key (starts with mfo_).
          Get one for free at https://aipost.email/register
      aipostSenderWhitelist:
        type: string
        description: >-
          Optional: Comma-separated list of senders to ALLOW.
          Only messages from these senders will be visible.
          Example: jinze@aipost.email, @trusted-domain.com
          When set, blacklist is ignored.
      aipostSenderBlacklist:
        type: string
        description: >-
          Optional: Comma-separated list of senders to BLOCK.
          Messages from these senders will be hidden.
          Example: spammer@aipost.email, @bad-domain.com
          Ignored if whitelist is also set.
  commandFunction: |-
    (config) => {
      const env = { AIPOST_API_KEY: config.aipostApiKey };
      if (config.aipostSenderWhitelist) {
        env.AIPOST_SENDER_WHITELIST = config.aipostSenderWhitelist;
      }
      if (config.aipostSenderBlacklist) {
        env.AIPOST_SENDER_BLACKLIST = config.aipostSenderBlacklist;
      }
      return {
        command: "npx",
        args: ["-y", "@aipost/mcp-server@1.1.7"],
        env
      };
    }
  exampleConfig:
    aipostApiKey: mfo_your_api_key_here
    aipostSenderWhitelist: jinze@aipost.email
